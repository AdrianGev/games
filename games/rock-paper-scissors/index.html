<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rock paper scissors</title>
<link rel="stylesheet" href="../../base.css">
<style>
  #moves button { min-width: 110px; padding: 14px 0; font-size: 18px; }
  #log { font: 14px "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive; margin: 8px 0; text-align: center; }
  .score { font: 400 32px "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive; margin: 16px 0 8px; text-align: center; }
</style>
</head>
<body>
<main>
<header><h1>Rock paper scissors</h1><a href="../../">Back to Menu</a></header>
<div class="score" id="score"></div>
<div id="moves" class="bar"></div>
<div id="log"></div>
<p id="status"></p>
<div class="bar">
  <select id="level" aria-label="Bot">
    <option value="easy">bot: easy (random)</option>
    <option value="medium" selected>bot: medium (counts your habits)</option>
    <option value="hard">bot: hard (reads your patterns)</option>
  </select>
  <button id="new">New match</button>
</div>
<p class="muted">First to 5 wins. The bot picks before it sees your move, but it does remember what you played.</p>
</main>
<script>
const $ = id => document.getElementById(id);
const MOVES = ['rock', 'paper', 'scissors'];
const beatenBy = m => (m + 1) % 3;
const GOAL = 5;
let me, bot, hist, last;

const argmax = counts => {
  const top = Math.max(...counts);
  const best = counts.map((c, i) => c === top ? i : -1).filter(i => i >= 0);
  return best[Math.floor(Math.random() * best.length)];
};

function botPick(level, h) {
  if (level === 'easy' || !h.length) return Math.floor(Math.random() * 3);
  const freq = [0, 0, 0];
  h.forEach(m => freq[m]++);
  let predicted = argmax(freq);
  if (level === 'hard') {
    const after = [0, 0, 0];
    for (let i = 0; i + 1 < h.length; i++) if (h[i] === h.at(-1)) after[h[i + 1]]++;
    if (after.some(Boolean)) predicted = argmax(after);
  }
  return beatenBy(predicted);
}

function reset() {
  me = bot = 0; hist = []; last = '';
  render();
}

function play(m) {
  if (me >= GOAL || bot >= GOAL) return;
  const b = botPick($('level').value, hist);
  hist.push(m);
  const r = m === b ? 'tie' : beatenBy(b) === m ? 'win' : 'lose';
  if (r === 'win') me++; else if (r === 'lose') bot++;
  last = `You: ${MOVES[m]} | Bot: ${MOVES[b]} | ${r === 'tie' ? 'Tie' : r === 'win' ? 'You win the round' : 'Bot wins the round'}`;
  render();
}

function render() {
  const done = me >= GOAL || bot >= GOAL;
  $('score').textContent = `You ${me} : ${bot} Bot`;
  $('moves').replaceChildren(...MOVES.map((name, i) => {
    const b = document.createElement('button');
    b.textContent = name[0].toUpperCase() + name.slice(1);
    b.disabled = done;
    b.onclick = () => play(i);
    return b;
  }));
  $('log').textContent = last;
  $('status').textContent = done ? (me > bot ? 'You win the match.' : 'The bot wins the match.') : `Round ${hist.length + 1}`;
}

$('level').onchange = $('new').onclick = reset;
reset();
</script>
</body>
</html>
