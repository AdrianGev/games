<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>snake</title>
<link rel="stylesheet" href="../../base.css">
<style>canvas { max-width: 520px; }</style>
</head>
<body>
<main>
<header><h1>Snake</h1><a href="../../">Back to Menu</a></header>
<div class="info"><span id="score" class="label"></span></div>
<canvas id="c" width="400" height="400"></canvas>
<p id="status"></p>
<div class="bar">
  <select id="speed" aria-label="Speed">
    <option value="140">easy</option>
    <option value="100" selected>medium</option>
    <option value="65">hard</option>
  </select>
  <button id="new">New game</button>
</div>
<p class="muted">Arrow keys or WASD. The first key starts the game.</p>
</main>
<script>
const N = 20, PX = 20;
const $ = id => document.getElementById(id);
const ctx = $('c').getContext('2d');
const KEYS = { ArrowUp: [0,-1], w: [0,-1], ArrowDown: [0,1], s: [0,1], ArrowLeft: [-1,0], a: [-1,0], ArrowRight: [1,0], d: [1,0] };
let snake, dir, queued, food, score, timer, over, started;

const best = () => { try { return Number(localStorage.getItem('snake-best')) || 0; } catch { return 0; } };

function reset() {
  clearInterval(timer);
  snake = [[10, 10], [9, 10], [8, 10]];
  dir = [1, 0]; queued = dir;
  score = 0; over = false; started = false;
  placeFood();
  paint();
}

function placeFood() {
  do food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)];
  while (snake.some(([x, y]) => x === food[0] && y === food[1]));
}

function step() {
  dir = queued;
  const head = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
  const ate = head[0] === food[0] && head[1] === food[1];
  const body = ate ? snake : snake.slice(0, -1);
  if (head[0] < 0 || head[1] < 0 || head[0] >= N || head[1] >= N || body.some(([x, y]) => x === head[0] && y === head[1])) {
    over = true;
    clearInterval(timer);
    try { if (score > best()) localStorage.setItem('snake-best', score); } catch {}
    paint();
    return;
  }
  snake.unshift(head);
  if (ate) { score++; placeFood(); } else snake.pop();
  paint();
}

function paint() {
  ctx.fillStyle = '#f3f4f6';
  ctx.fillRect(0, 0, N * PX, N * PX);
  ctx.fillStyle = '#1d5fd1';
  ctx.fillRect(food[0] * PX + 3, food[1] * PX + 3, PX - 6, PX - 6);
  ctx.fillStyle = '#1b1f24';
  for (const [x, y] of snake) ctx.fillRect(x * PX + 1, y * PX + 1, PX - 2, PX - 2);
  $('score').textContent = `Score ${score} | Best ${best()}`;
  $('status').textContent = over ? 'Game over. Press New game.' : '';
}

document.addEventListener('keydown', e => {
  const d = KEYS[e.key];
  if (!d || over) return;
  e.preventDefault();
  if (d[0] === -dir[0] && d[1] === -dir[1]) return;
  queued = d;
  if (!started) { started = true; timer = setInterval(step, Number($('speed').value)); }
});
$('new').onclick = reset;
$('speed').onchange = e => { e.target.blur(); reset(); };
reset();
</script>
</body>
</html>
