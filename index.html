<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>games</title>
<link rel="stylesheet" href="base.css">
<style>
  h2 { font: 12px "Comic Sans MS", "Comic Sans", "Chalkboard SE", cursive; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 32px 0 4px; }
  h2 { margin-bottom: 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li a { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; color: var(--ink); background: var(--bg); border: 2px solid var(--ink); border-radius: 2px; text-decoration: none; font-size: 22px; }
    li span { font-size: 15px; text-align: right; }
</style>
</head>
<body>
<main>
<header><h1>games</h1></header>
<div id="list"></div>
</main>
<script>
const GAMES = {
  'Against a bot': [
    ['tictactoe', 'Tic tac toe', '1-2 players, 3 levels'],
    ['connect4', 'Connect 4', '1-2 players, 3 levels'],
    ['checkers', 'Checkers', '1-2 players, 3 levels'],
    ['rock-paper-scissors', 'Rock paper scissors', '1 player, 3 levels'],
    ['pig', 'Pig', '1 player, 3 levels'],
    ['pong', 'Pong', '1 player, 3 levels'],
  ],
  'Cards': [
    ['blackjack', 'Blackjack', '1 player'],
    ['higher-or-lower', 'Higher or lower', '1 player, 3 levels'],
  ],
  'Words': [
    ['wordle', 'Word guess', '1 player, 3 levels'],
    ['hangman', 'Hangman', '1 player, 3 levels'],
  ],
  'Puzzles': [
    ['sudoku', 'Sudoku', '1 player, 3 levels'],
    ['minesweeper', 'Minesweeper', '1 player, 3 levels'],
    ['2048', '2048', '1 player'],
    ['sliding-puzzle', 'Sliding puzzle', '1 player, 3 levels'],
    ['lights-out', 'Lights Out', '1 player, 3 levels'],
    ['hanoi', 'Tower of Hanoi', '1 player, 3 levels'],
    ['mastermind', 'Mastermind', '1 player, 3 levels'],
    ['memory', 'Memory', '1 player, 3 levels'],
  ],
  'Arcade': [
    ['snake', 'Snake', '1 player, 3 speeds'],
    ['breakout', 'Breakout', '1 player, 3 levels'],
  ],
};
document.getElementById('list').innerHTML = Object.entries(GAMES).map(([group, games]) =>
  `<h2>${group}</h2><ul>${games.map(([dir, title, note]) =>
    `<li><a href="games/${dir}/">${title}<span>${note}</span></a></li>`).join('')}</ul>`).join('');
</script>
</body>
</html>
